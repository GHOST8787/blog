    <style>
        .pj-filter { position: relative; width: fit-content; font-family: 'JetBrains Mono', monospace; z-index: 30; }
        .pj-filter-trigger {
            background: rgb(var(--c-surface)/0.8);
            border: 1px solid rgb(var(--c-ink)/0.2);
            color: rgb(var(--c-purple));
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            user-select: none;
        }
        .pj-filter-trigger .pj-current { color: rgb(var(--c-ink)); font-weight: 700; letter-spacing: 0.05em; }
        .pj-filter-trigger .pj-caret { font-size: 10px; opacity: 0.6; transition: transform 0.3s ease; }
        .pj-filter:hover .pj-filter-trigger, .pj-filter.open .pj-filter-trigger {
            background: rgb(var(--c-purple)/0.15);
            border-color: rgb(var(--c-purple));
            color: white;
        }
        .pj-filter:hover .pj-caret, .pj-filter.open .pj-caret { transform: rotate(180deg); }
        .pj-filter-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 8px;
            background: rgb(var(--c-bg)/0.95);
            border: 1px solid rgb(var(--c-purple)/0.3);
            border-radius: 12px;
            padding: 8px;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px -10px rgb(var(--c-ink-inv)/0.8);
        }
        .pj-filter:hover .pj-filter-menu, .pj-filter.open .pj-filter-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .pj-filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            color: var(--c-dim2);
            transition: all 0.2s;
            border: 1px solid transparent;
            letter-spacing: 0.05em;
        }
        .pj-filter-option:hover { background: rgb(var(--c-ink)/0.05); color: white; }
        .pj-filter-option.active { background: rgb(var(--c-purple)/0.1); border-color: rgb(var(--c-purple)/0.3); color: white; font-weight: bold; }
        .pj-filter-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 5px currentColor; flex-shrink: 0; }
        .empty-state { color: var(--c-dim); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; }
    </style>

<body class="font-sans selection:bg-accent-purple/30 selection:text-white">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 dot-pattern opacity-50"></div>
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/10 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <div id="navbar-placeholder"></div>

    <main class="relative z-10 max-w-7xl mx-auto px-8 md:px-12 pt-32 pb-24">

        <div class="list-head relative z-20">
        <div class="list-hero pointer-events-none">
            <h1 class="text-gradient">Projects</h1>
            <p class="text-purple-400">Code, design &amp; everything in between.</p>
        </div>
        <div class="list-controls">
        <label class="list-search">
            <i class="fas fa-search"></i>
            <input type="search" id="pj-search" placeholder="Search" aria-label="Search projects" autocomplete="off">
        </label>
        <div class="pj-filter" id="filter-bar">
            <div class="pj-filter-trigger">
                <i class="fas fa-filter"></i>
                <span>FILTER ·</span>
                <span class="pj-current">ALL</span>
                <i class="fas fa-chevron-down pj-caret"></i>
            </div>
            <div class="pj-filter-menu">
                <div class="pj-filter-option active" data-filter="all" data-label="ALL">
                    <div class="pj-filter-dot" style="color: var(--c-dim2)"></div>
                    ALL
                </div>
                <div class="pj-filter-option" data-filter="engineering" data-label="ENGINEERING">
                    <div class="pj-filter-dot" style="color: #5EEAD4"></div>
                    ENGINEERING
                </div>
                <div class="pj-filter-option" data-filter="ai-and-automation" data-label="AI & AUTOMATION">
                    <div class="pj-filter-dot" style="color: rgb(var(--c-purple))"></div>
                    AI &amp; AUTOMATION
                </div>
            </div>
        </div>
        </div>
        </div>

        <div id="project-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
        </div>
        <p id="pj-empty" class="list-empty" hidden>No matching projects.</p>

        <div id="empty-hint" class="hidden mt-12 text-center empty-state">
            English translations are landing one by one. <a href="../projects.html" class="text-accent-purple hover:underline">Read the Chinese versions →</a>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script>
    function parseNumberFromUrl(url, prefix) {
        const m = url.match(/_([A-Za-z0-9]+)\.html$/i);
        if (!m) return prefix + '?';
        let n = m[1];
        if (/^\d+$/.test(n)) n = n.padStart(2, '0');
        return prefix + n.toUpperCase();
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('project-container');
        if (!container) return;

        try {
            const listResponse = await fetch('data/projects.json');
            if (!listResponse.ok) throw new Error('Failed to fetch project list');
            const projects = (await listResponse.json()).reverse();

            if (projects.length === 0) {
                document.getElementById('empty-hint').classList.remove('hidden');
            }

            await Promise.all(projects.map(async (article) => {
                const card = document.createElement('a');
                card.href = article.url;
                card.setAttribute('data-category', article.category || 'other');
                card.className = 'project-card-vertical group block opacity-0 translate-y-[30px]';
                const number = parseNumberFromUrl(article.url, 'P');
                card.innerHTML = `
                    <div class="lc-cover relative aspect-video overflow-hidden rounded-t-3xl bg-white/5">
                        <img src="" alt="Loading..." class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                    </div>
                    <div class="flex flex-col flex-grow text-left">
                        <div class="lc-top">
                            <span class="number-badge">${number}</span>
                            <span class="date-box"></span>
                        </div>
                        <div class="lc-main">
                            <h4 class="lc-title text-white mb-3 group-hover:text-accent-purple transition-colors">Loading...</h4>
                            <p class="text-gray-400 text-sm leading-relaxed line-clamp-3"></p>
                            <div class="tag-box lc-tags"></div>
                        </div>
                    </div>
                `;
                container.appendChild(card);

                await fetchAndFillCard(card, article.url, article.cover);
            }));

            if (typeof window.refreshAnimations === 'function') {
                window.initAnimations();
            }

            const pjFilter = document.getElementById('filter-bar');
            const pjTrigger = pjFilter.querySelector('.pj-filter-trigger');
            const pjCurrent = pjFilter.querySelector('.pj-current');
            const pjOptions = pjFilter.querySelectorAll('.pj-filter-option');

            pjTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                pjFilter.classList.toggle('open');
            });
            document.addEventListener('click', () => pjFilter.classList.remove('open'));
            pjFilter.addEventListener('click', (e) => e.stopPropagation());

            // 分類與搜尋一起套用；寬卡只給「全部、沒搜尋」時的第一張，篩選後全部回到同尺寸
            const searchInput = document.getElementById('pj-search');
            const emptyHint = document.getElementById('pj-empty');
            let currentFilter = 'all';
            const applyFilters = () => {
                const q = searchInput.value.trim().toLowerCase();
                let shown = 0;
                document.querySelectorAll('.project-card-vertical').forEach(card => {
                    const okCat = currentFilter === 'all' || card.dataset.category === currentFilter;
                    const okText = !q || card.textContent.toLowerCase().includes(q);
                    card.style.display = (okCat && okText) ? '' : 'none';
                    if (okCat && okText) shown++;
                });
                const first = container.firstElementChild;
                if (first) first.classList.toggle('lc-featured', currentFilter === 'all' && !q);
                emptyHint.hidden = shown > 0;
            };
            searchInput.addEventListener('input', applyFilters);

            pjOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    currentFilter = opt.dataset.filter;

                    pjOptions.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    pjCurrent.textContent = opt.dataset.label;
                    pjFilter.classList.remove('open');
                    applyFilters();
                });
            });
            applyFilters();

        } catch (error) {
            console.error("projects init failed:", error);
        }
    });

    async function fetchAndFillCard(card, url, cover) {
        try {
            const response = await fetch(url);
            const htmlText = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            const dateIcon = doc.querySelector('header .fa-calendar');
            const cardDateBox = card.querySelector('.date-box');
            if (dateIcon && dateIcon.parentElement && cardDateBox) {
                const dateText = dateIcon.parentElement.textContent.trim();
                cardDateBox.textContent = dateText;
            }

            // 文章 h1 是「主標：<br><span>副標</span>」。原本用 innerText 整串塞進卡片，
            // <br> 變成空格、全形冒號後面再多一格，看起來像標題中間破了一個洞；
            // 改成主標、副標各自一行，主標尾端的冒號拿掉。
            const titleEl = doc.querySelector('header h1');
            if (titleEl) {
                const h4 = card.querySelector('h4');
                const sub = titleEl.querySelector('span');
                const subText = sub ? sub.textContent.replace(/\\s+/g, ' ').trim() : '';
                let main = titleEl.textContent.replace(/\\s+/g, ' ').trim();
                if (subText && main.endsWith(subText)) main = main.slice(0, -subText.length);
                main = main.trim().replace(/[：:]+$/, '').trim();
                h4.textContent = '';
                const mainEl = document.createElement('span');
                mainEl.className = 'block';
                mainEl.textContent = main;
                h4.appendChild(mainEl);
                if (subText) {
                    const subEl = document.createElement('span');
                    subEl.className = 'lc-sub block text-sm font-medium text-gray-400 mt-1 line-clamp-2';
                    subEl.textContent = subText;
                    h4.appendChild(subEl);
                }
            }

            const cardImg = card.querySelector('img');
            if (cover) {
                cardImg.src = cover;
            } else {
                const firstImg = doc.querySelector('article img') || doc.querySelector('figure img');
                if (firstImg) {
                    let imgSrc = firstImg.getAttribute('src');
                    if (imgSrc && imgSrc.startsWith('../../')) imgSrc = imgSrc.substring(3);
                    else if (imgSrc && imgSrc.startsWith('../')) imgSrc = imgSrc.substring(3);
                    cardImg.src = imgSrc;
                } else {
                    cardImg.remove();
                    const placeholder = card.querySelector('.aspect-video');
                    if (placeholder) {
                        placeholder.classList.add('flex', 'items-center', 'justify-center');
                        placeholder.innerHTML = '<span class="text-gray-600 text-xs font-mono uppercase tracking-wider">No Image</span>';
                    }
                }
            }

            const sourceTags = doc.querySelectorAll('header .flex.gap-3 span');
            const cardTagBox = card.querySelector('.tag-box');
            if (sourceTags.length > 0) {
                const primary = sourceTags[0].textContent.trim();
                const slug = primary.toLowerCase()
                    .replace(/&/g, 'and')
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-|-$/g, '');
                card.setAttribute('data-category', slug);
            }
            if (sourceTags.length > 0 && cardTagBox) {
                cardTagBox.innerHTML = '';
                sourceTags.forEach(tag => {
                    const newTag = document.createElement('span');
                    if (cardTagBox.children.length === 0) newTag.className = 'lc-tag-main';
                    newTag.textContent = tag.textContent.trim();
                    cardTagBox.appendChild(newTag);
                });
            }

            const summaryEl = doc.querySelector('article .text-xl') || doc.querySelector('article p');
            if (summaryEl) card.querySelector('p').textContent = summaryEl.innerText.trim();

        } catch (err) {
            console.warn(`Project fetch failed: ${url}`, err);
        }
    }
</script>
