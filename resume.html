<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | GHOST.ouo</title>
    <meta name="description" content="GHOST.ouo 給各家公司的履歷檔案，需密碼解鎖。">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Resume | GHOST.ouo">
    <meta property="og:description" content="一份公司一份履歷，需密碼解鎖。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ghost8787.github.io/blog/resume.html">
    <meta property="og:image" content="https://ghost8787.github.io/blog/PNG/pixelS2.png">
    <link rel="icon" type="image/png" href="PNG/pixelS2.png">
    <link rel="apple-touch-icon" href="PNG/pixelS2.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="i18n.js" defer></script>
    <script type="module" src="main.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <script src="resume.js" defer></script>

    <style>
        /* 履歷列表卡片：版型沿用 .done-row，配色改紫色（accent-purple） */
        .resume-row{
            display:flex; align-items:center; gap:14px;
            padding:14px 18px;
            background:rgba(191,148,255,.04);
            border:1px solid rgba(191,148,255,.14);
            border-radius:10px;
            margin-bottom:10px;
            transition:all .3s;
            text-decoration:none; color:inherit;
            cursor:pointer;
        }
        .resume-row:hover{
            border-color:rgba(191,148,255,.4);
            box-shadow:0 0 20px rgba(191,148,255,.12);
            transform:translateX(4px);
        }
        .resume-row .lock{
            width:28px; height:28px; border-radius:50%;
            background:rgba(191,148,255,.15); color:#BF94FF;
            display:flex; align-items:center; justify-content:center;
            font-size:12px; flex-shrink:0;
        }
        .resume-row .text{ flex:1; color:#ddd; font-size:.95rem; font-weight:600; }
        .resume-row .meta{
            font-family:'JetBrains Mono',monospace; font-size:10px;
            color:#BF94FF; letter-spacing:.05em; white-space:nowrap;
        }
        .resume-row .arrow{
            color:#666; font-size:11px;
        }
        .resume-row:hover .arrow{ color:#BF94FF; }
    </style>
</head>

<body class="font-sans selection:bg-accent-purple/30 selection:text-white">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 dot-pattern opacity-50"></div>
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-600/10 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/10 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <div id="navbar-placeholder"></div>

    <main class="relative z-10 max-w-3xl mx-auto px-6 sm:px-8 lg:px-10 pt-24 md:pt-32 pb-24">

        <header class="text-center mb-11">
            <div class="inline-block px-3 py-1 rounded-full bg-accent-purple/10 border border-accent-purple/20 text-accent-purple text-[10px] font-bold uppercase tracking-wider mb-6">
                RESUME ARCHIVE
            </div>
            <h1 class="text-4xl md:text-6xl font-extrabold mb-4 text-gradient leading-tight">
                resume archive.
            </h1>
            <p class="text-gray-400 text-sm md:text-base max-w-xl mx-auto">
                一份公司一份履歷，需密碼解鎖。
            </p>
        </header>

        <div class="section-head">
            <h2>已建立</h2>
            <span class="count" id="resume-count">載入中...</span>
        </div>

        <section id="resume-list">
            <div class="text-center text-gray-500 font-mono text-sm py-6">載入中...</div>
        </section>

        <p class="text-center text-gray-500 text-xs mt-12 font-mono">
            <i class="fas fa-lock text-accent-purple/60 mr-1"></i>
            點任一條輸入密碼解鎖。
        </p>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
