<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Anthropic 格式的請求經過 Switchyard 轉成 OpenAI 格式送往上游，回程再轉回 Anthropic 格式">
  <defs>
    <linearGradient id="np09g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BF94FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C5BD9" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="np09arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BF94FF"/>
    </marker>
    <marker id="np09arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="420" fill="#050505"/>

  <text x="32" y="42" fill="#9CA3AF" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.5">REQUEST REWRITE / 2026-09-01 本機實測</text>

  <!-- client -->
  <rect x="32" y="76" width="230" height="176" rx="12" fill="#0D0D0F" stroke="#2A2A31"/>
  <text x="52" y="106" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">客戶端</text>
  <text x="52" y="130" fill="#6B7280" font-family="JetBrains Mono, monospace" font-size="11">Anthropic Messages</text>
  <line x1="52" y1="144" x2="242" y2="144" stroke="#2A2A31"/>
  <text x="52" y="168" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">POST /v1/messages</text>
  <text x="52" y="190" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">model: fast</text>
  <text x="52" y="212" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">max_tokens: 64</text>
  <text x="52" y="234" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">x-api-key: dummy</text>

  <!-- switchyard -->
  <rect x="345" y="76" width="230" height="176" rx="12" fill="#140F1F" stroke="url(#np09g)" stroke-width="1.5"/>
  <text x="365" y="106" fill="#BF94FF" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">Switchyard 0.2.0</text>
  <text x="365" y="130" fill="#8B7BA8" font-family="JetBrains Mono, monospace" font-size="11">127.0.0.1:4000</text>
  <line x1="365" y1="144" x2="555" y2="144" stroke="#3A2F52"/>
  <text x="365" y="168" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">route  fast</text>
  <text x="365" y="190" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">type   passthrough</text>
  <text x="365" y="212" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">target weak</text>
  <text x="365" y="234" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">往返 14.35 ms</text>

  <!-- upstream -->
  <rect x="658" y="76" width="230" height="176" rx="12" fill="#0D0D0F" stroke="#2A2A31"/>
  <text x="678" y="106" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">上游</text>
  <text x="678" y="130" fill="#6B7280" font-family="JetBrains Mono, monospace" font-size="11">OpenAI Chat Completions</text>
  <line x1="678" y1="144" x2="868" y2="144" stroke="#2A2A31"/>
  <text x="678" y="168" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">POST /v1/chat/completions</text>
  <text x="678" y="190" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">model: mock-weak</text>
  <text x="678" y="212" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">max_completion_tokens: 64</text>
  <text x="678" y="234" fill="#D1D5DB" font-family="JetBrains Mono, monospace" font-size="11.5">Bearer lab-dummy</text>

  <!-- forward arrows -->
  <line x1="262" y1="150" x2="337" y2="150" stroke="#BF94FF" stroke-width="1.6" marker-end="url(#np09arrow)"/>
  <line x1="575" y1="150" x2="650" y2="150" stroke="#BF94FF" stroke-width="1.6" marker-end="url(#np09arrow)"/>

  <!-- return arrows -->
  <line x1="650" y1="196" x2="583" y2="196" stroke="#6B7280" stroke-width="1.4" marker-end="url(#np09arrowdim)"/>
  <line x1="337" y1="196" x2="270" y2="196" stroke="#6B7280" stroke-width="1.4" marker-end="url(#np09arrowdim)"/>

  <!-- rewrite notes -->
  <rect x="32" y="292" width="856" height="96" rx="12" fill="#0A0A0C" stroke="#1F1F26"/>
  <text x="52" y="320" fill="#BF94FF" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="1">中間被改寫的三件事</text>
  <text x="52" y="346" fill="#9CA3AF" font-family="Plus Jakarta Sans, sans-serif" font-size="13">端點 /v1/messages 換成 /v1/chat/completions　·　欄位 max_tokens 換成 max_completion_tokens</text>
  <text x="52" y="370" fill="#9CA3AF" font-family="Plus Jakarta Sans, sans-serif" font-size="13">憑證 x-api-key: dummy 沒有送到上游，上游收到的是伺服器自己的 Bearer lab-dummy</text>

  <text x="268" y="276" fill="#6B7280" font-family="JetBrains Mono, monospace" font-size="10.5">回程　content / stop_reason / usage　（Anthropic 欄位）</text>
</svg>
