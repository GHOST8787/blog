<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <rect width="680" height="500" fill="#0a0e14"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#0a0e14"/>

  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">I/O Bottleneck：為什麼 AI 需要高速 Storage</text>

  <!-- ===== TOP: Bottleneck concept ===== -->
  <text x="170" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">✗ 儲存慢</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">✓ 儲存快</text>

  <!-- Left: slow storage -->
  <rect x="60" y="82" width="90" height="100" rx="8" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="0.6"/>
  <text x="105" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">GPU</text>
  <!-- Idle blocks -->
  <rect x="72" y="116" width="66" height="12" rx="2" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="0.4"/>
  <text x="105" y="126" text-anchor="middle" font-size="8" fill="#f87171">idle 等資料</text>
  <rect x="72" y="132" width="20" height="12" rx="2" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-width="0.4"/>
  <rect x="96" y="132" width="42" height="12" rx="2" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="0.4"/>
  <rect x="72" y="148" width="66" height="12" rx="2" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="0.4"/>
  <text x="105" y="158" text-anchor="middle" font-size="8" fill="#f87171">idle</text>
  <rect x="72" y="164" width="30" height="12" rx="2" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-width="0.4"/>

  <line x1="105" y1="182" x2="105" y2="210" stroke="#f87171" stroke-width="1" marker-end="url(#r)"/>

  <rect x="60" y="214" width="90" height="40" rx="6" fill="rgba(148,163,184,0.06)" stroke="#64748b" stroke-width="0.5"/>
  <text x="105" y="232" text-anchor="middle" font-size="10" fill="#64748b">HDD</text>
  <text x="105" y="246" text-anchor="middle" font-size="9" fill="#5a7290">200 MB/s</text>

  <text x="170" y="130" font-size="10" fill="#f87171">GPU 利用率低</text>
  <text x="170" y="148" font-size="10" fill="#f87171">大部分時間在</text>
  <text x="170" y="166" font-size="10" fill="#f87171">等 Storage 餵資料</text>

  <!-- Right: fast storage -->
  <rect x="400" y="82" width="90" height="100" rx="8" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="0.6"/>
  <text x="445" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">GPU</text>
  <!-- Busy blocks -->
  <rect x="412" y="116" width="66" height="12" rx="2" fill="rgba(52,211,153,0.25)" stroke="#34d399" stroke-width="0.4"/>
  <rect x="412" y="132" width="66" height="12" rx="2" fill="rgba(52,211,153,0.25)" stroke="#34d399" stroke-width="0.4"/>
  <rect x="412" y="148" width="66" height="12" rx="2" fill="rgba(52,211,153,0.25)" stroke="#34d399" stroke-width="0.4"/>
  <rect x="412" y="164" width="66" height="12" rx="2" fill="rgba(52,211,153,0.25)" stroke="#34d399" stroke-width="0.4"/>

  <line x1="445" y1="182" x2="445" y2="210" stroke="#34d399" stroke-width="1" marker-end="url(#g)"/>

  <rect x="400" y="214" width="90" height="40" rx="6" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="445" y="232" text-anchor="middle" font-size="10" fill="#f59e0b">NVMe</text>
  <text x="445" y="246" text-anchor="middle" font-size="9" fill="#5a7290">7,000 MB/s</text>

  <text x="506" y="130" font-size="10" fill="#34d399">GPU 利用率高</text>
  <text x="506" y="148" font-size="10" fill="#34d399">資料供給跟得上</text>
  <text x="506" y="166" font-size="10" fill="#34d399">運算能力被充分使用</text>

  <!-- Divider -->
  <line x1="310" y1="76" x2="310" y2="268" stroke="#2a3a4e" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- ===== BOTTOM: 4 scenarios ===== -->
  <line x1="40" y1="284" x2="640" y2="284" stroke="#2a3a4e" stroke-width="0.5"/>
  <text x="340" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">四個需要高速儲存的環節</text>

  <!-- Scenario 1 -->
  <rect x="40" y="334" width="140" height="100" rx="8" fill="rgba(245,158,11,0.04)" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="110" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">① 訓練</text>
  <text x="110" y="374" text-anchor="middle" font-size="10" fill="#8599b0">Data Loading</text>
  <text x="110" y="396" text-anchor="middle" font-size="10" fill="#5a7290">數據集 TB~PB 級</text>
  <text x="110" y="412" text-anchor="middle" font-size="10" fill="#5a7290">GPU 持續讀資料</text>
  <text x="110" y="428" text-anchor="middle" font-size="10" fill="#f87171">I/O 慢 = GPU 空轉</text>

  <!-- Scenario 2 -->
  <rect x="196" y="334" width="140" height="100" rx="8" fill="rgba(245,158,11,0.04)" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="266" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">② Checkpoint</text>
  <text x="266" y="374" text-anchor="middle" font-size="10" fill="#8599b0">存模型權重</text>
  <text x="266" y="396" text-anchor="middle" font-size="10" fill="#5a7290">數十～數百 GB</text>
  <text x="266" y="412" text-anchor="middle" font-size="10" fill="#5a7290">定期寫回儲存</text>
  <text x="266" y="428" text-anchor="middle" font-size="10" fill="#f87171">寫入慢 = 訓練暫停</text>

  <!-- Scenario 3 -->
  <rect x="352" y="334" width="140" height="100" rx="8" fill="rgba(245,158,11,0.04)" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="422" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">③ 模型載入</text>
  <text x="422" y="374" text-anchor="middle" font-size="10" fill="#8599b0">推論啟動</text>
  <text x="422" y="396" text-anchor="middle" font-size="10" fill="#5a7290">LLaMA 70B ≈ 130GB</text>
  <text x="422" y="412" text-anchor="middle" font-size="10" fill="#64748b">HDD：數分鐘</text>
  <text x="422" y="428" text-anchor="middle" font-size="10" fill="#34d399">NVMe：數秒</text>

  <!-- Scenario 4 -->
  <rect x="508" y="334" width="140" height="100" rx="8" fill="rgba(245,158,11,0.04)" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="578" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">④ RAG 檢索</text>
  <text x="578" y="374" text-anchor="middle" font-size="10" fill="#8599b0">即時查向量 DB</text>
  <text x="578" y="396" text-anchor="middle" font-size="10" fill="#5a7290">推論時即時讀取</text>
  <text x="578" y="412" text-anchor="middle" font-size="10" fill="#5a7290">延遲直接影響</text>
  <text x="578" y="428" text-anchor="middle" font-size="10" fill="#f87171">使用者回應時間</text>

  <!-- Bottom -->
  <text x="340" y="468" text-anchor="middle" font-size="11" fill="#5a7290">四個環節都在做同一件事：大量讀寫資料。儲存速度決定 GPU 被浪費多少</text>
  <text x="340" y="488" text-anchor="middle" font-size="11" fill="#f59e0b">NVMe SSD 的控制器效能，直接決定這四個環節的速度上限</text>
</svg>
