<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <rect width="680" height="520" fill="#0a0e14"/>
  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">HCI 四大廠商定位圖</text>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#5a7290">各家的 Hypervisor、SDS 引擎、管理介面、核心差異</text>

  <!-- ===== Nutanix ===== -->
  <rect x="40" y="76" width="290" height="180" rx="12" fill="rgba(52,211,153,0.04)" stroke="#34d399" stroke-width="0.7"/>
  <text x="60" y="102" font-size="15" font-weight="800" fill="#34d399">Nutanix</text>
  <text x="60" y="120" font-size="10" fill="#5a7290">獨立軟體公司，不賣硬體</text>

  <text x="60" y="144" font-size="11" fill="#8599b0">Hypervisor</text>
  <text x="175" y="144" font-size="11" fill="#e2e8f0">AHV（KVM）/ ESXi / Hyper-V</text>

  <text x="60" y="164" font-size="11" fill="#8599b0">SDS 引擎</text>
  <text x="175" y="164" font-size="11" fill="#e2e8f0">Nutanix DSF</text>

  <text x="60" y="184" font-size="11" fill="#8599b0">管理介面</text>
  <text x="175" y="184" font-size="11" fill="#e2e8f0">Prism Central（Web UI）</text>

  <text x="60" y="204" font-size="11" fill="#8599b0">最小部署</text>
  <text x="175" y="204" font-size="11" fill="#e2e8f0">1 節點</text>

  <text x="60" y="232" font-size="11" font-weight="600" fill="#34d399">▸ Gartner MQ Leader</text>
  <text x="60" y="248" font-size="11" font-weight="600" fill="#34d399">▸ VMware 客戶外逃的最大受益者</text>

  <!-- ===== VMware vSAN ===== -->
  <rect x="350" y="76" width="290" height="180" rx="12" fill="rgba(56,189,248,0.04)" stroke="#38bdf8" stroke-width="0.7"/>
  <text x="370" y="102" font-size="15" font-weight="800" fill="#38bdf8">VMware vSAN</text>
  <text x="370" y="120" font-size="10" fill="#5a7290">Broadcom 子公司</text>

  <text x="370" y="144" font-size="11" fill="#8599b0">Hypervisor</text>
  <text x="485" y="144" font-size="11" fill="#e2e8f0">ESXi only</text>

  <text x="370" y="164" font-size="11" fill="#8599b0">SDS 引擎</text>
  <text x="485" y="164" font-size="11" fill="#e2e8f0">vSAN</text>

  <text x="370" y="184" font-size="11" fill="#8599b0">管理介面</text>
  <text x="485" y="184" font-size="11" fill="#e2e8f0">vCenter</text>

  <text x="370" y="204" font-size="11" fill="#8599b0">最小部署</text>
  <text x="485" y="204" font-size="11" fill="#e2e8f0">2 節點</text>

  <text x="370" y="232" font-size="11" font-weight="600" fill="#f87171">▸ 授權改 VCF 捆綁，價格大漲</text>
  <text x="370" y="248" font-size="11" font-weight="600" fill="#f87171">▸ 既有客戶龐大，但新客戶流失中</text>

  <!-- ===== Azure Stack HCI ===== -->
  <rect x="40" y="276" width="290" height="180" rx="12" fill="rgba(167,139,250,0.04)" stroke="#a78bfa" stroke-width="0.7"/>
  <text x="60" y="302" font-size="15" font-weight="800" fill="#a78bfa">Azure Stack HCI</text>
  <text x="60" y="320" font-size="10" fill="#5a7290">Microsoft</text>

  <text x="60" y="344" font-size="11" fill="#8599b0">Hypervisor</text>
  <text x="175" y="344" font-size="11" fill="#e2e8f0">Hyper-V</text>

  <text x="60" y="364" font-size="11" fill="#8599b0">SDS 引擎</text>
  <text x="175" y="364" font-size="11" fill="#e2e8f0">Storage Spaces Direct（S2D）</text>

  <text x="60" y="384" font-size="11" fill="#8599b0">管理介面</text>
  <text x="175" y="384" font-size="11" fill="#e2e8f0">Azure Portal（Arc）</text>

  <text x="60" y="404" font-size="11" fill="#8599b0">最小部署</text>
  <text x="175" y="404" font-size="11" fill="#e2e8f0">2 節點</text>

  <text x="60" y="432" font-size="11" font-weight="600" fill="#a78bfa">▸ Azure 雲端深度整合</text>
  <text x="60" y="448" font-size="11" font-weight="600" fill="#a78bfa">▸ AKS on HCI、AVD on HCI</text>

  <!-- ===== Phison HCI ===== -->
  <rect x="350" y="276" width="290" height="180" rx="12" fill="rgba(245,158,11,0.04)" stroke="#f59e0b" stroke-width="0.7"/>
  <text x="370" y="302" font-size="15" font-weight="800" fill="#f59e0b">Phison HCI</text>
  <text x="370" y="320" font-size="10" fill="#5a7290">群聯電子</text>

  <text x="370" y="344" font-size="11" fill="#8599b0">Hypervisor</text>
  <text x="485" y="344" font-size="11" fill="#e2e8f0">依方案而定</text>

  <text x="370" y="364" font-size="11" fill="#8599b0">SDS 引擎</text>
  <text x="485" y="364" font-size="11" fill="#e2e8f0">自有方案</text>

  <text x="370" y="384" font-size="11" fill="#8599b0">核心優勢</text>
  <text x="485" y="384" font-size="11" fill="#e2e8f0">自家 NVMe 控制器</text>

  <text x="370" y="404" font-size="11" fill="#8599b0">目標市場</text>
  <text x="485" y="404" font-size="11" fill="#e2e8f0">中小企業、垂直產業</text>

  <text x="370" y="432" font-size="11" font-weight="600" fill="#f59e0b">▸ 儲存技術垂直整合為競爭力</text>
  <text x="370" y="448" font-size="11" font-weight="600" fill="#f59e0b">▸ 銀行分行、製造邊緣場景</text>

  <!-- Bottom context -->
  <text x="340" y="490" text-anchor="middle" font-size="11" fill="#5a7290">2023 Broadcom 收購 VMware → 授權大漲 → 客戶外逃 → Nutanix 受益最多</text>
  <text x="340" y="510" text-anchor="middle" font-size="11" fill="#5a7290">這個市場洗牌是所有 HCI 廠商的機會窗口</text>
</svg>
