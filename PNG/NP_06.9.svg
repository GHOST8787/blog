<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <rect width="680" height="480" fill="#0a0e14"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#0a0e14"/>

  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">傳統架構 vs HCI：擴展方式的根本差異</text>

  <!-- ===== LEFT: Traditional ===== -->
  <text x="155" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">傳統架構</text>
  <text x="155" y="84" text-anchor="middle" font-size="11" fill="#5a7290">Scale-up：升級單一設備</text>

  <!-- Separate boxes -->
  <rect x="40" y="100" width="100" height="110" rx="8" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="0.6"/>
  <text x="90" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">Server</text>
  <text x="90" y="142" text-anchor="middle" font-size="9" fill="#5a7290">Dell</text>
  <text x="90" y="156" text-anchor="middle" font-size="9" fill="#5a7290">PowerEdge</text>
  <text x="90" y="192" text-anchor="middle" font-size="9" fill="#64748b">管理介面 A</text>

  <rect x="160" y="100" width="100" height="110" rx="8" fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="210" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#f59e0b">SAN</text>
  <text x="210" y="142" text-anchor="middle" font-size="9" fill="#5a7290">NetApp</text>
  <text x="210" y="156" text-anchor="middle" font-size="9" fill="#5a7290">儲存陣列</text>
  <text x="210" y="192" text-anchor="middle" font-size="9" fill="#64748b">管理介面 B</text>

  <rect x="80" y="224" width="140" height="40" rx="6" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="150" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8">Network Switch</text>

  <!-- Problem callouts -->
  <rect x="36" y="284" width="234" height="90" rx="8" fill="rgba(248,113,113,0.06)" stroke="#f87171" stroke-width="0.5"/>
  <text x="153" y="308" text-anchor="middle" font-size="11" fill="#f87171">✗ 三套分開管理</text>
  <text x="153" y="328" text-anchor="middle" font-size="11" fill="#f87171">✗ 擴展要分別升級三樣</text>
  <text x="153" y="348" text-anchor="middle" font-size="11" fill="#f87171">✗ 容量不夠？換更大的設備</text>
  <text x="153" y="366" text-anchor="middle" font-size="11" fill="#f87171">✗ 資源各自閒置無法調度</text>

  <!-- ===== Arrow ===== -->
  <line x1="298" y1="200" x2="368" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== RIGHT: HCI ===== -->
  <text x="510" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">HCI 架構</text>
  <text x="510" y="84" text-anchor="middle" font-size="11" fill="#5a7290">Scale-out：加節點</text>

  <!-- Node 1 -->
  <rect x="380" y="100" width="80" height="160" rx="8" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="0.7"/>
  <text x="420" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Node 1</text>
  <rect x="390" y="132" width="60" height="18" rx="3" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.4"/>
  <text x="420" y="145" text-anchor="middle" font-size="8" fill="#8599b0">CPU+RAM</text>
  <rect x="390" y="156" width="60" height="18" rx="3" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="420" y="169" text-anchor="middle" font-size="8" fill="#8599b0">NVMe</text>
  <rect x="390" y="180" width="60" height="18" rx="3" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.4"/>
  <text x="420" y="193" text-anchor="middle" font-size="8" fill="#8599b0">Network</text>
  <rect x="390" y="204" width="60" height="18" rx="3" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="0.4"/>
  <text x="420" y="217" text-anchor="middle" font-size="8" fill="#8599b0">Hypervisor</text>
  <rect x="390" y="228" width="60" height="18" rx="3" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="0.3"/>
  <text x="420" y="241" text-anchor="middle" font-size="8" fill="#64748b">VMs</text>

  <!-- Node 2 -->
  <rect x="470" y="100" width="80" height="160" rx="8" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="0.7"/>
  <text x="510" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Node 2</text>
  <rect x="480" y="132" width="60" height="18" rx="3" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.4"/>
  <text x="510" y="145" text-anchor="middle" font-size="8" fill="#8599b0">CPU+RAM</text>
  <rect x="480" y="156" width="60" height="18" rx="3" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="510" y="169" text-anchor="middle" font-size="8" fill="#8599b0">NVMe</text>
  <rect x="480" y="180" width="60" height="18" rx="3" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.4"/>
  <text x="510" y="193" text-anchor="middle" font-size="8" fill="#8599b0">Network</text>
  <rect x="480" y="204" width="60" height="18" rx="3" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="0.4"/>
  <text x="510" y="217" text-anchor="middle" font-size="8" fill="#8599b0">Hypervisor</text>
  <rect x="480" y="228" width="60" height="18" rx="3" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="0.3"/>
  <text x="510" y="241" text-anchor="middle" font-size="8" fill="#64748b">VMs</text>

  <!-- Node 3 -->
  <rect x="560" y="100" width="80" height="160" rx="8" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="0.7"/>
  <text x="600" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Node 3</text>
  <rect x="570" y="132" width="60" height="18" rx="3" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.4"/>
  <text x="600" y="145" text-anchor="middle" font-size="8" fill="#8599b0">CPU+RAM</text>
  <rect x="570" y="156" width="60" height="18" rx="3" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.4"/>
  <text x="600" y="169" text-anchor="middle" font-size="8" fill="#8599b0">NVMe</text>
  <rect x="570" y="180" width="60" height="18" rx="3" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.4"/>
  <text x="600" y="193" text-anchor="middle" font-size="8" fill="#8599b0">Network</text>
  <rect x="570" y="204" width="60" height="18" rx="3" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="0.4"/>
  <text x="600" y="217" text-anchor="middle" font-size="8" fill="#8599b0">Hypervisor</text>
  <rect x="570" y="228" width="60" height="18" rx="3" fill="rgba(167,139,250,0.06)" stroke="#a78bfa" stroke-width="0.3"/>
  <text x="600" y="241" text-anchor="middle" font-size="8" fill="#64748b">VMs</text>

  <!-- SDS layer connecting nodes -->
  <rect x="380" y="270" width="260" height="30" rx="6" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="4 3"/>
  <text x="510" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">Software-Defined Storage（SDS）</text>
  <text x="510" y="318" text-anchor="middle" font-size="10" fill="#5a7290">三個節點的 NVMe 組成一個大儲存池</text>
  <text x="510" y="334" text-anchor="middle" font-size="10" fill="#5a7290">資料自動跨節點複製（RF=2 或 RF=3）</text>

  <!-- Benefits -->
  <rect x="376" y="352" width="268" height="90" rx="8" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="0.5"/>
  <text x="510" y="376" text-anchor="middle" font-size="11" fill="#34d399">✓ 單一 Web UI 管理全部</text>
  <text x="510" y="396" text-anchor="middle" font-size="11" fill="#34d399">✓ 不夠？加一台 Node 就好</text>
  <text x="510" y="416" text-anchor="middle" font-size="11" fill="#34d399">✓ 任一台掛掉，其他台接手</text>
  <text x="510" y="436" text-anchor="middle" font-size="11" fill="#34d399">✓ 軟體自動調度資源</text>

  <!-- Divider -->
  <line x1="330" y1="96" x2="330" y2="460" stroke="#2a3a4e" stroke-width="0.5" stroke-dasharray="4 3"/>

  <text x="340" y="472" text-anchor="middle" font-size="11" fill="#5a7290">HCI 的核心：每個節點都是完整的一台（運算＋儲存＋網路），再用軟體把它們黏在一起</text>
</svg>
