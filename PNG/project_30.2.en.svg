<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Whiteboard three-partition data architecture">
  <defs>
    <marker id="wbArrowEn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BF94FF"/>
    </marker>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      .sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="920" height="400" fill="#050505"/>

  <text class="mono" x="32" y="38" fill="#BF94FF" font-size="12" letter-spacing="2.2">WHITEBOARD / THREE DATA PARTITIONS</text>
  <text class="mono" x="32" y="60" fill="#6B7280" font-size="11">State is node position, not a field. Permission travels with position.</text>

  <text class="mono" x="40" y="104" fill="#9CA3AF" font-size="11">any signed-in user submits</text>
  <path d="M 200 99 L 242 99" stroke="#BF94FF" stroke-width="1.6" marker-end="url(#wbArrowEn)"/>

  <rect x="40" y="120" width="240" height="160" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="sans" x="60" y="152" fill="#FFFFFF" font-size="14.5" font-weight="700">Pending</text>
  <text class="mono" x="60" y="182" fill="#6B7280" font-size="11">write</text>
  <text class="mono" x="110" y="182" fill="#9CA3AF" font-size="11">any user, create only</text>
  <text class="mono" x="60" y="204" fill="#6B7280" font-size="11">read</text>
  <text class="mono" x="110" y="204" fill="#9CA3AF" font-size="11">owner only</text>
  <line x1="60" y1="222" x2="260" y2="222" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="60" y="244" fill="#6B7280" font-size="11">Sits here after submit —</text>
  <text class="mono" x="60" y="262" fill="#6B7280" font-size="11">even the author cannot see it</text>

  <path d="M 288 200 L 332 200" stroke="#BF94FF" stroke-width="1.6" marker-end="url(#wbArrowEn)"/>
  <text class="mono" x="286" y="188" fill="#BF94FF" font-size="10">approved</text>

  <rect x="340" y="120" width="240" height="160" rx="12" fill="#140F1F" stroke="#3A2F52" stroke-width="1"/>
  <text class="sans" x="360" y="152" fill="#FFFFFF" font-size="14.5" font-weight="700">Public &#183; wish pool</text>
  <text class="mono" x="360" y="182" fill="#6B7280" font-size="11">write</text>
  <text class="mono" x="410" y="182" fill="#9CA3AF" font-size="11">owner; vote field &#177;1 open</text>
  <text class="mono" x="360" y="204" fill="#6B7280" font-size="11">read</text>
  <text class="mono" x="410" y="204" fill="#9CA3AF" font-size="11">everyone</text>
  <line x1="360" y1="222" x2="560" y2="222" stroke="#3A2F52" stroke-width="1"/>
  <text class="mono" x="360" y="244" fill="#BF94FF" font-size="11">Vote count sets card size,</text>
  <text class="mono" x="360" y="262" fill="#BF94FF" font-size="11">one vote per account</text>

  <path d="M 588 200 L 632 200" stroke="#BF94FF" stroke-width="1.6" marker-end="url(#wbArrowEn)"/>
  <text class="mono" x="594" y="188" fill="#BF94FF" font-size="10">shipped</text>

  <rect x="640" y="120" width="240" height="160" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="sans" x="660" y="152" fill="#FFFFFF" font-size="14.5" font-weight="700">Done</text>
  <text class="mono" x="660" y="182" fill="#6B7280" font-size="11">write</text>
  <text class="mono" x="710" y="182" fill="#9CA3AF" font-size="11">owner</text>
  <text class="mono" x="660" y="204" fill="#6B7280" font-size="11">read</text>
  <text class="mono" x="710" y="204" fill="#9CA3AF" font-size="11">everyone</text>
  <line x1="660" y1="222" x2="860" y2="222" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="660" y="244" fill="#6B7280" font-size="11">Carries a completion date</text>
  <text class="mono" x="660" y="262" fill="#6B7280" font-size="11">and two links</text>

  <rect x="40" y="308" width="840" height="56" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="sans" x="60" y="334" fill="#FFFFFF" font-size="13" font-weight="700">Counter</text>
  <text class="mono" x="140" y="334" fill="#9CA3AF" font-size="11">The running number behind the #001 on each card</text>
  <text class="mono" x="60" y="352" fill="#6B7280" font-size="11">No status field anywhere in the flow — whichever node it sits in is the state</text>
</svg>
