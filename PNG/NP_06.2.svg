<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7a8fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="320" fill="#0a0e14"/>


  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">伺服器三種物理形態</text>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#5a7290">由左到右：密度越來越高、規模越來越大</text>

  <!-- Tower -->
  <rect x="40" y="76" width="170" height="140" rx="10" fill="rgba(148,163,184,0.06)" stroke="#64748b" stroke-width="0.6"/>
  <text x="125" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#cbd5e1">Tower</text>
  <text x="125" y="118" text-anchor="middle" font-size="11" fill="#8599b0">像桌上型電腦</text>
  <!-- Tower icon -->
  <rect x="100" y="132" width="50" height="64" rx="4" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <line x1="110" y1="144" x2="140" y2="144" stroke="#64748b" stroke-width="0.5"/>
  <line x1="110" y1="150" x2="140" y2="150" stroke="#64748b" stroke-width="0.5"/>
  <circle cx="125" cy="178" r="5" fill="none" stroke="#64748b" stroke-width="0.5"/>
  <text x="125" y="228" text-anchor="middle" font-size="11" fill="#5a7290">小型辦公室</text>

  <!-- Arrow -->
  <line x1="220" y1="146" x2="248" y2="146" stroke="#5a7290" stroke-width="0.8" marker-end="url(#a)"/>

  <!-- Rack -->
  <rect x="258" y="76" width="170" height="140" rx="10" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="0.6"/>
  <text x="343" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">Rack</text>
  <text x="343" y="118" text-anchor="middle" font-size="11" fill="#8599b0">裝在 19 吋機櫃</text>
  <!-- Rack icon: stacked units -->
  <rect x="308" y="132" width="70" height="14" rx="3" fill="none" stroke="#34d399" stroke-width="0.6"/>
  <rect x="308" y="148" width="70" height="14" rx="3" fill="none" stroke="#34d399" stroke-width="0.6"/>
  <rect x="308" y="164" width="70" height="14" rx="3" fill="none" stroke="#34d399" stroke-width="0.6"/>
  <rect x="308" y="180" width="70" height="14" rx="3" fill="none" stroke="#34d399" stroke-width="0.6"/>
  <text x="392" y="156" font-size="10" fill="#5a7290">1U</text>
  <text x="392" y="172" font-size="10" fill="#5a7290">1U</text>
  <text x="343" y="228" text-anchor="middle" font-size="11" fill="#5a7290">企業主流</text>

  <!-- Arrow -->
  <line x1="438" y1="146" x2="466" y2="146" stroke="#5a7290" stroke-width="0.8" marker-end="url(#a)"/>

  <!-- Blade -->
  <rect x="476" y="76" width="170" height="140" rx="10" fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="561" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">Blade</text>
  <text x="561" y="118" text-anchor="middle" font-size="11" fill="#8599b0">共用機箱資源</text>
  <!-- Blade icon: vertical slices -->
  <rect x="520" y="132" width="82" height="62" rx="4" fill="none" stroke="#f59e0b" stroke-width="0.6"/>
  <line x1="530" y1="136" x2="530" y2="190" stroke="#f59e0b" stroke-width="0.5"/>
  <line x1="540" y1="136" x2="540" y2="190" stroke="#f59e0b" stroke-width="0.5"/>
  <line x1="550" y1="136" x2="550" y2="190" stroke="#f59e0b" stroke-width="0.5"/>
  <line x1="560" y1="136" x2="560" y2="190" stroke="#f59e0b" stroke-width="0.5"/>
  <line x1="570" y1="136" x2="570" y2="190" stroke="#f59e0b" stroke-width="0.5"/>
  <line x1="580" y1="136" x2="580" y2="190" stroke="#f59e0b" stroke-width="0.5"/>
  <line x1="590" y1="136" x2="590" y2="190" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="561" y="228" text-anchor="middle" font-size="11" fill="#5a7290">最高密度</text>

  <!-- Scale arrow -->
  <line x1="70" y1="270" x2="616" y2="270" stroke="#5a7290" stroke-width="0.6" marker-end="url(#a)"/>
  <text x="70" y="292" font-size="11" fill="#5a7290">小</text>
  <text x="340" y="292" text-anchor="middle" font-size="11" fill="#8599b0">密度 / 規模</text>
  <text x="616" y="292" text-anchor="end" font-size="11" fill="#5a7290">大</text>
</svg>
