<svg viewBox="0 0 680 545" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7a8fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="545" fill="#0a0e14"/>


  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Cache Server：Application 與 Storage 之間的加速層</text>

  <!-- ===== LEFT: Without Cache ===== -->
  <text x="148" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">沒有 Cache</text>

  <rect x="78" y="76" width="140" height="42" rx="8" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="148" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#a78bfa">Application</text>

  <line x1="148" y1="118" x2="148" y2="162" stroke="#7a8fa3" stroke-width="1" marker-end="url(#x)"/>
  <text x="164" y="144" font-size="10" fill="#5a7290">每次都讀硬碟</text>

  <rect x="78" y="166" width="140" height="42" rx="8" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="148" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#f59e0b">Database / Storage</text>

  <text x="148" y="232" text-anchor="middle" font-size="11" fill="#5a7290">每次請求都讀硬碟</text>
  <text x="148" y="248" text-anchor="middle" font-size="11" fill="#5a7290">硬碟慢 → 回應慢</text>
  <text x="148" y="264" text-anchor="middle" font-size="11" fill="#5a7290">流量大時扛不住</text>

  <!-- Divider -->
  <line x1="290" y1="60" x2="290" y2="276" stroke="#2a3a4e" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- ===== RIGHT: With Cache ===== -->
  <text x="478" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">有 Cache</text>

  <rect x="408" y="76" width="140" height="42" rx="8" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="478" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#a78bfa">Application</text>

  <!-- Arrow down to cache -->
  <line x1="478" y1="118" x2="478" y2="148" stroke="#34d399" stroke-width="1.2" marker-end="url(#g)"/>
  <text x="494" y="138" font-size="10" fill="#34d399">① 先問 Cache</text>

  <!-- Cache Server -->
  <rect x="396" y="152" width="164" height="52" rx="10" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.8"/>
  <text x="478" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">Cache Server</text>
  <text x="478" y="192" text-anchor="middle" font-size="11" fill="#8599b0">資料存在 RAM 中</text>

  <!-- Cache Hit: return left and up -->
  <path d="M396 178 L346 178 L346 126 L406 102" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#g)"/>
  <text x="332" y="142" text-anchor="end" font-size="11" font-weight="600" fill="#34d399">② 有 →</text>
  <text x="332" y="158" text-anchor="end" font-size="11" fill="#34d399">直接回傳</text>
  <text x="332" y="174" text-anchor="end" font-size="10" fill="#5a7290">（Cache Hit）</text>

  <!-- Cache Miss: down to DB -->
  <line x1="478" y1="204" x2="478" y2="244" stroke="#f59e0b" stroke-width="1" marker-end="url(#o)"/>
  <text x="494" y="228" font-size="10" fill="#f59e0b">③ 沒有 →</text>

  <rect x="408" y="248" width="140" height="42" rx="8" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="478" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#f59e0b">Database / Storage</text>

  <!-- Return and store -->
  <path d="M550 269 L590 269 L590 178 L562 178" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#o)"/>
  <text x="604" y="216" font-size="10" fill="#f59e0b">讀完順便</text>
  <text x="604" y="232" font-size="10" fill="#f59e0b">存一份到</text>
  <text x="604" y="248" font-size="10" fill="#f59e0b">Cache</text>

  <!-- ===== BOTTOM: Speed Comparison ===== -->
  <line x1="40" y1="306" x2="640" y2="306" stroke="#2a3a4e" stroke-width="0.5"/>

  <text x="340" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">為什麼快：RAM vs 硬碟的速度差</text>

  <!-- RAM bar -->
  <rect x="200" y="352" width="400" height="28" rx="5" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.6"/>
  <text x="400" y="371" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">RAM：~50,000 MB/s，延遲 ~100 ns</text>
  <text x="186" y="371" text-anchor="end" font-size="11" fill="#8599b0">RAM</text>

  <!-- NVMe bar -->
  <rect x="200" y="390" width="96" height="28" rx="5" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="248" y="409" text-anchor="middle" font-size="11" font-weight="600" fill="#f59e0b">~7,000</text>
  <text x="186" y="409" text-anchor="end" font-size="11" fill="#8599b0">NVMe</text>

  <!-- HDD bar -->
  <rect x="200" y="428" width="8" height="28" rx="3" fill="rgba(148,163,184,0.1)" stroke="#64748b" stroke-width="0.5"/>
  <text x="186" y="447" text-anchor="end" font-size="11" fill="#8599b0">HDD</text>
  <text x="222" y="447" font-size="11" fill="#5a7290">~200 MB/s</text>

  <!-- ===== Common Software ===== -->
  <text x="340" y="490" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">常見的 Cache 軟體</text>

  <rect x="80" y="502" width="96" height="28" rx="14" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="0.5"/>
  <text x="128" y="521" text-anchor="middle" font-size="12" font-weight="500" fill="#fb923c">Redis</text>

  <rect x="196" y="502" width="120" height="28" rx="14" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="256" y="521" text-anchor="middle" font-size="12" font-weight="500" fill="#a78bfa">Memcached</text>

  <rect x="336" y="502" width="96" height="28" rx="14" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.5"/>
  <text x="384" y="521" text-anchor="middle" font-size="12" font-weight="500" fill="#38bdf8">Varnish</text>

  <rect x="452" y="502" width="80" height="28" rx="14" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.5"/>
  <text x="492" y="521" text-anchor="middle" font-size="12" font-weight="500" fill="#34d399">CDN</text>
</svg>
