<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="四種路由演算法構成的抽象化階梯：passthrough 抽掉模型名、協定轉換抽掉供應商格式、random 決定流量分配、llm_classifier 讓模型決定模型">
  <defs>
    <marker id="np092arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BF94FF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="470" fill="#050505"/>

  <text x="32" y="40" fill="#9CA3AF" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.5">ABSTRACTION LADDER / 四種決策方式</text>
  <text x="32" y="64" fill="#6B7280" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5">同一個入口，往下換掉的東西一層比一層多</text>

  <!-- row 1 -->
  <rect x="32" y="88" width="856" height="78" rx="10" fill="#0A0A0C" stroke="#1F1F26"/>
  <text x="52" y="118" fill="#BF94FF" font-family="JetBrains Mono, monospace" font-size="13">passthrough</text>
  <text x="52" y="144" fill="#6B7280" font-family="JetBrains Mono, monospace" font-size="11">fast → mock-weak</text>
  <line x1="240" y1="127" x2="288" y2="127" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#np092arrow)"/>
  <text x="306" y="122" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5" font-weight="700">抽掉模型名字</text>
  <text x="306" y="146" fill="#9CA3AF" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5">呼叫端只認得路由 id，實際 target 留在設定層</text>

  <!-- row 2 -->
  <rect x="32" y="178" width="856" height="78" rx="10" fill="#0A0A0C" stroke="#1F1F26"/>
  <text x="52" y="208" fill="#BF94FF" font-family="JetBrains Mono, monospace" font-size="13">protocol translation</text>
  <text x="52" y="234" fill="#6B7280" font-family="JetBrains Mono, monospace" font-size="11">/v1/messages → /v1/chat/completions</text>
  <line x1="240" y1="217" x2="288" y2="217" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#np092arrow)"/>
  <text x="306" y="212" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5" font-weight="700">抽掉供應商格式</text>
  <text x="306" y="236" fill="#9CA3AF" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5">Anthropic 客戶端打得動只認 OpenAI 格式的上游</text>

  <!-- row 3 -->
  <rect x="32" y="268" width="856" height="78" rx="10" fill="#0A0A0C" stroke="#1F1F26"/>
  <text x="52" y="298" fill="#BF94FF" font-family="JetBrains Mono, monospace" font-size="13">random</text>
  <text x="52" y="324" fill="#6B7280" font-family="JetBrains Mono, monospace" font-size="11">weights [3, 7]　30 發 → 9 / 21</text>
  <line x1="240" y1="307" x2="288" y2="307" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#np092arrow)"/>
  <text x="306" y="302" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5" font-weight="700">抽掉流量分配</text>
  <text x="306" y="326" fill="#9CA3AF" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5">A/B 測試與成本配比寫在設定裡，不寫進應用程式</text>

  <!-- row 4 -->
  <rect x="32" y="358" width="856" height="86" rx="10" fill="#140F1F" stroke="#3A2F52"/>
  <text x="52" y="388" fill="#BF94FF" font-family="JetBrains Mono, monospace" font-size="13">llm_classifier</text>
  <text x="52" y="414" fill="#8B7BA8" font-family="JetBrains Mono, monospace" font-size="11">judge → p_solve → weak / strong</text>
  <line x1="240" y1="397" x2="288" y2="397" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#np092arrow)"/>
  <text x="306" y="392" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5" font-weight="700">抽掉選模型這個決定</text>
  <text x="306" y="416" fill="#9CA3AF" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5">交給另一個模型判斷，代價是新 session 多一次呼叫</text>
</svg>
