<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <rect width="680" height="310" fill="#0a0e14"/>

  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">儲存媒體速度階梯（順序讀取）</text>

  <!-- Y-axis -->
  <line x1="100" y1="60" x2="100" y2="240" stroke="#5a7290" stroke-width="0.5"/>
  <text x="88" y="68" text-anchor="end" font-size="11" fill="#5a7290">快</text>
  <text x="88" y="240" text-anchor="end" font-size="11" fill="#5a7290">慢</text>

  <!-- HDD bar -->
  <rect x="140" y="210" width="120" height="30" rx="5" fill="rgba(148,163,184,0.1)" stroke="#64748b" stroke-width="0.6"/>
  <text x="200" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">HDD</text>
  <text x="200" y="260" text-anchor="middle" font-size="11" fill="#5a7290">~200 MB/s</text>
  <text x="200" y="276" text-anchor="middle" font-size="10" fill="#64748b">100–200 IOPS</text>

  <!-- SATA SSD bar -->
  <rect x="300" y="190" width="120" height="50" rx="5" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.6"/>
  <text x="360" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">SATA SSD</text>
  <text x="360" y="228" text-anchor="middle" font-size="10" fill="#8599b0">2.75x faster</text>
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#5a7290">~550 MB/s</text>
  <text x="360" y="276" text-anchor="middle" font-size="10" fill="#64748b">~90K IOPS</text>

  <!-- NVMe bar -->
  <rect x="460" y="72" width="140" height="168" rx="5" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="530" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">NVMe SSD</text>
  <text x="530" y="150" text-anchor="middle" font-size="11" fill="#8599b0">17–35x faster</text>
  <text x="530" y="260" text-anchor="middle" font-size="11" fill="#5a7290">~3,500–7,000 MB/s</text>
  <text x="530" y="276" text-anchor="middle" font-size="10" fill="#64748b">500K–1M+ IOPS</text>

  <!-- NVMe controller callout -->
  <line x1="530" y1="72" x2="530" y2="56" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="534" y="54" font-size="11" font-weight="600" fill="#f59e0b">控制器晶片負責讀寫調度與資料管理</text>

  <text x="340" y="302" text-anchor="middle" font-size="11" fill="#5a7290">柱高 = 相對速度。NVMe 透過 PCIe 直連 CPU，跳過 SATA 控制器瓶頸</text>
</svg>
