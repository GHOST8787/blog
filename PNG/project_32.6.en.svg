<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="The five steps from creating a Meet poll to locking a slot in, plus the company tool slot code branch">
  <defs>
    <marker id="mtFlowArrowEn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BF94FF"/>
    </marker>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      .sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="920" height="400" fill="#050505"/>

  <text class="mono" x="32" y="38" fill="#BF94FF" font-size="12" letter-spacing="2.2">MEET / FROM CREATE TO LOCKED IN</text>
  <text class="mono" x="32" y="60" fill="#6B7280" font-size="11">Five steps, and the only thing moving between them is one URL</text>

  <rect x="36" y="96" width="152" height="140" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="54" y="122" fill="#BF94FF" font-size="10" letter-spacing="1.6">01</text>
  <text class="sans" x="54" y="150" fill="#FFFFFF" font-size="14.5" font-weight="700">Create</text>
  <text class="mono" x="54" y="170" fill="#6B7280" font-size="10">organizer</text>
  <text class="mono" x="54" y="196" fill="#9CA3AF" font-size="10.5">title and slots</text>
  <text class="mono" x="54" y="212" fill="#9CA3AF" font-size="10.5">Google sign-in</text>

  <rect x="210" y="96" width="152" height="140" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="228" y="122" fill="#BF94FF" font-size="10" letter-spacing="1.6">02</text>
  <text class="sans" x="228" y="150" fill="#FFFFFF" font-size="14.5" font-weight="700">Share</text>
  <text class="mono" x="228" y="170" fill="#6B7280" font-size="10">organizer</text>
  <text class="mono" x="228" y="196" fill="#9CA3AF" font-size="10.5">copy the URL</text>
  <text class="mono" x="228" y="212" fill="#9CA3AF" font-size="10.5">URL is the pass</text>

  <rect x="384" y="96" width="152" height="140" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="402" y="122" fill="#BF94FF" font-size="10" letter-spacing="1.6">03</text>
  <text class="sans" x="402" y="150" fill="#FFFFFF" font-size="14.5" font-weight="700">Reply</text>
  <text class="mono" x="402" y="170" fill="#6B7280" font-size="10">participant</text>
  <text class="mono" x="402" y="196" fill="#9CA3AF" font-size="10.5">3 states per slot</text>
  <text class="mono" x="402" y="212" fill="#9CA3AF" font-size="10.5">guests add a name</text>

  <rect x="558" y="96" width="152" height="140" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="576" y="122" fill="#BF94FF" font-size="10" letter-spacing="1.6">04</text>
  <text class="sans" x="576" y="150" fill="#FFFFFF" font-size="14.5" font-weight="700">Read</text>
  <text class="mono" x="576" y="170" fill="#6B7280" font-size="10">organizer</text>
  <text class="mono" x="576" y="196" fill="#9CA3AF" font-size="10.5">bar plus names</text>
  <text class="mono" x="576" y="212" fill="#9CA3AF" font-size="10.5">counts replies</text>

  <rect x="732" y="96" width="152" height="140" rx="12" fill="#140F1F" stroke="#3A2F52" stroke-width="1"/>
  <text class="mono" x="750" y="122" fill="#BF94FF" font-size="10" letter-spacing="1.6">05</text>
  <text class="sans" x="750" y="150" fill="#FFFFFF" font-size="14.5" font-weight="700">Lock in</text>
  <text class="mono" x="750" y="170" fill="#6B7280" font-size="10">organizer</text>
  <text class="mono" x="750" y="196" fill="#BF94FF" font-size="10.5">voting stops</text>
  <text class="mono" x="750" y="212" fill="#9CA3AF" font-size="10.5">view updates</text>

  <path d="M 190 166 L 206 166" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#mtFlowArrowEn)"/>
  <path d="M 364 166 L 380 166" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#mtFlowArrowEn)"/>
  <path d="M 538 166 L 554 166" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#mtFlowArrowEn)"/>
  <path d="M 712 166 L 728 166" stroke="#BF94FF" stroke-width="1.4" marker-end="url(#mtFlowArrowEn)"/>

  <rect x="36" y="272" width="410" height="92" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="56" y="298" fill="#BF94FF" font-size="10" letter-spacing="1.6">BRANCH　SLOTS FROM THE COMPANY TOOL</text>
  <text class="mono" x="56" y="322" fill="#9CA3AF" font-size="10.5">The find-a-time tool emits a code starting with MT1.</text>
  <text class="mono" x="56" y="342" fill="#9CA3AF" font-size="10.5">Paste it into the import field in step 01</text>
  <path d="M 112 268 L 112 244" stroke="#BF94FF" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#mtFlowArrowEn)"/>

  <rect x="474" y="272" width="410" height="92" rx="12" fill="#0A0A0C" stroke="#1F1F26" stroke-width="1"/>
  <text class="mono" x="494" y="298" fill="#6B7280" font-size="10" letter-spacing="1.6">AFTER THE LOCK-IN</text>
  <text class="mono" x="494" y="322" fill="#9CA3AF" font-size="10.5">The organizer sends the calendar invite themselves</text>
  <text class="mono" x="494" y="342" fill="#9CA3AF" font-size="10.5">Undo the lock-in to reopen voting before the deadline</text>
  <path d="M 808 268 L 808 244" stroke="#BF94FF" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#mtFlowArrowEn)"/>
</svg>
