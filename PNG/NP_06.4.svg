<svg viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7a8fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="530" fill="#0a0e14"/>

  <!-- ===== TOP: DAS (center x=110) ===== -->
  <text x="110" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#cbd5e1">DAS</text>
  <text x="110" y="46" text-anchor="middle" font-size="11" fill="#5a7290">Direct Attached</text>

  <rect x="55" y="60" width="110" height="40" rx="8" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.6"/>
  <text x="110" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">Server</text>

  <line x1="110" y1="100" x2="110" y2="126" stroke="#34d399" stroke-width="1" marker-end="url(#g)"/>
  <text x="128" y="116" font-size="10" fill="#5a7290">直連</text>

  <rect x="60" y="130" width="100" height="36" rx="8" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="110" y="153" text-anchor="middle" font-size="12" fill="#f59e0b">硬碟</text>

  <text x="110" y="190" text-anchor="middle" font-size="11" fill="#5a7290">最簡單</text>
  <text x="110" y="206" text-anchor="middle" font-size="11" fill="#5a7290">無法共享</text>

  <!-- ===== TOP: NAS (center x=340) ===== -->
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#cbd5e1">NAS</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#5a7290">Network Attached</text>

  <rect x="258" y="60" width="76" height="40" rx="8" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.6"/>
  <text x="296" y="85" text-anchor="middle" font-size="12" fill="#34d399">Server A</text>

  <rect x="348" y="60" width="76" height="40" rx="8" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="386" y="85" text-anchor="middle" font-size="12" fill="#38bdf8">Server B</text>

  <line x1="296" y1="100" x2="296" y2="140" stroke="#34d399" stroke-width="0.8" marker-end="url(#g)"/>
  <line x1="386" y1="100" x2="386" y2="140" stroke="#38bdf8" stroke-width="0.8" marker-end="url(#b)"/>

  <text x="282" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#34d399">NFS</text>
  <text x="400" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#38bdf8">SMB</text>

  <rect x="264" y="144" width="152" height="26" rx="13" fill="none" stroke="#5a7290" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="162" text-anchor="middle" font-size="10" fill="#5a7290">乙太網路 LAN</text>

  <line x1="340" y1="170" x2="340" y2="194" stroke="#7a8fa3" stroke-width="0.8" marker-end="url(#a)"/>

  <rect x="290" y="198" width="100" height="36" rx="8" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="340" y="221" text-anchor="middle" font-size="12" fill="#f59e0b">NAS 設備</text>

  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#5a7290">檔案層級共享</text>
  <text x="340" y="272" text-anchor="middle" font-size="11" fill="#5a7290">多台伺服器存取同份檔案</text>

  <!-- ===== TOP: SAN (center x=570) ===== -->
  <text x="570" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#cbd5e1">SAN</text>
  <text x="570" y="46" text-anchor="middle" font-size="11" fill="#5a7290">Storage Area Network</text>

  <rect x="490" y="60" width="76" height="40" rx="8" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.6"/>
  <text x="528" y="85" text-anchor="middle" font-size="12" fill="#34d399">Server A</text>

  <rect x="580" y="60" width="76" height="40" rx="8" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="618" y="85" text-anchor="middle" font-size="12" fill="#38bdf8">Server B</text>

  <line x1="528" y1="100" x2="528" y2="140" stroke="#fb923c" stroke-width="0.8" marker-end="url(#r)"/>
  <line x1="618" y1="100" x2="618" y2="140" stroke="#fb923c" stroke-width="0.8" marker-end="url(#r)"/>

  <text x="514" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#fb923c">FC</text>
  <text x="632" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#fb923c">iSCSI</text>

  <rect x="496" y="144" width="158" height="26" rx="13" fill="none" stroke="#fb923c" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="575" y="162" text-anchor="middle" font-size="10" fill="#fb923c">獨立儲存網路</text>

  <line x1="575" y1="170" x2="575" y2="194" stroke="#7a8fa3" stroke-width="0.8" marker-end="url(#a)"/>

  <rect x="520" y="198" width="110" height="36" rx="8" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="0.6"/>
  <text x="575" y="221" text-anchor="middle" font-size="12" fill="#fb923c">SAN 儲存陣列</text>

  <text x="575" y="256" text-anchor="middle" font-size="11" fill="#5a7290">區塊層級存取</text>
  <text x="575" y="272" text-anchor="middle" font-size="11" fill="#5a7290">效能最高、架構最複雜</text>

  <!-- ===== BOTTOM: Comparison Table (columns aligned to x=110, 340, 570) ===== -->
  <line x1="30" y1="296" x2="650" y2="296" stroke="#2a3a4e" stroke-width="0.5"/>

  <!-- Column headers — same x as diagram centers -->
  <text x="110" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">DAS</text>
  <text x="340" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">NAS</text>
  <text x="570" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#fb923c">SAN</text>

  <!-- Header underline -->
  <line x1="30" y1="336" x2="650" y2="336" stroke="#2a3a4e" stroke-width="0.4"/>

  <!-- Row 1: 共享 -->
  <text x="30" y="360" font-size="11" fill="#5a7290">共享</text>
  <text x="110" y="360" text-anchor="middle" font-size="12" fill="#8599b0">✗ 不可</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="#8599b0">✓ 檔案共享</text>
  <text x="570" y="360" text-anchor="middle" font-size="12" fill="#8599b0">✓ 區塊共享</text>

  <!-- Row 2: 存取層級 -->
  <text x="30" y="388" font-size="11" fill="#5a7290">存取層級</text>
  <text x="110" y="388" text-anchor="middle" font-size="12" fill="#8599b0">區塊</text>
  <text x="340" y="388" text-anchor="middle" font-size="12" fill="#8599b0">檔案</text>
  <text x="570" y="388" text-anchor="middle" font-size="12" fill="#8599b0">區塊</text>

  <!-- Row 3: 協定 -->
  <text x="30" y="416" font-size="11" fill="#5a7290">協定</text>
  <text x="110" y="416" text-anchor="middle" font-size="12" fill="#8599b0">SATA / NVMe</text>
  <text x="340" y="416" text-anchor="middle" font-size="12" fill="#8599b0">NFS / SMB</text>
  <text x="570" y="416" text-anchor="middle" font-size="12" fill="#8599b0">FC / iSCSI</text>

  <!-- Row 4: 複雜度 -->
  <text x="30" y="444" font-size="11" fill="#5a7290">複雜度</text>
  <text x="110" y="444" text-anchor="middle" font-size="12" fill="#34d399">低</text>
  <text x="340" y="444" text-anchor="middle" font-size="12" fill="#f59e0b">中</text>
  <text x="570" y="444" text-anchor="middle" font-size="12" fill="#fb923c">高</text>

  <!-- Row 5: 效能 -->
  <text x="30" y="472" font-size="11" fill="#5a7290">效能</text>
  <text x="110" y="472" text-anchor="middle" font-size="12" fill="#8599b0">取決於硬碟</text>
  <text x="340" y="472" text-anchor="middle" font-size="12" fill="#8599b0">中</text>
  <text x="570" y="472" text-anchor="middle" font-size="12" fill="#8599b0">最高</text>

  <!-- Row separator lines -->
  <line x1="30" y1="370" x2="650" y2="370" stroke="#1a2a3e" stroke-width="0.3"/>
  <line x1="30" y1="398" x2="650" y2="398" stroke="#1a2a3e" stroke-width="0.3"/>
  <line x1="30" y1="426" x2="650" y2="426" stroke="#1a2a3e" stroke-width="0.3"/>
  <line x1="30" y1="454" x2="650" y2="454" stroke="#1a2a3e" stroke-width="0.3"/>

  <!-- Footer -->
  <text x="340" y="506" text-anchor="middle" font-size="11" fill="#5a7290">FC = Fibre Channel（光纖通道）｜iSCSI = SCSI over IP（用乙太網路傳區塊資料）</text>
  <text x="340" y="524" text-anchor="middle" font-size="11" fill="#5a7290">NFS = Linux 檔案共享協定｜SMB = Windows 檔案共享協定</text>
</svg>
