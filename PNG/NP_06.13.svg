<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <rect width="680" height="400" fill="#0a0e14"/>
  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">三大 AI 基礎架構方案</text>
  <text x="340" y="52" text-anchor="middle" font-size="11" fill="#5a7290">誰提供 GPU、儲存、網路、軟體的完整堆疊</text>

  <!-- ===== NVIDIA ===== -->
  <rect x="40" y="72" width="190" height="280" rx="12" fill="rgba(52,211,153,0.04)" stroke="#34d399" stroke-width="0.7"/>
  <text x="135" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#34d399">NVIDIA</text>
  <text x="135" y="118" text-anchor="middle" font-size="10" fill="#5a7290">全堆疊掌控者</text>

  <text x="56" y="144" font-size="11" font-weight="600" fill="#8599b0">GPU</text>
  <text x="56" y="162" font-size="11" fill="#e2e8f0">A100 → H100 → H200</text>
  <text x="56" y="178" font-size="11" fill="#e2e8f0">→ B200（Blackwell）</text>

  <text x="56" y="204" font-size="11" font-weight="600" fill="#8599b0">網路</text>
  <text x="56" y="222" font-size="11" fill="#e2e8f0">InfiniBand（Mellanox）</text>
  <text x="56" y="238" font-size="11" fill="#e2e8f0">Spectrum-X</text>

  <text x="56" y="264" font-size="11" font-weight="600" fill="#8599b0">軟體</text>
  <text x="56" y="282" font-size="11" fill="#e2e8f0">CUDA、cuDNN</text>
  <text x="56" y="298" font-size="11" fill="#e2e8f0">NIM（推論微服務）</text>

  <text x="56" y="324" font-size="11" font-weight="600" fill="#8599b0">整機</text>
  <text x="56" y="342" font-size="11" fill="#e2e8f0">DGX（自有品牌）</text>

  <!-- ===== Dell ===== -->
  <rect x="248" y="72" width="185" height="280" rx="12" fill="rgba(56,189,248,0.04)" stroke="#38bdf8" stroke-width="0.7"/>
  <text x="340" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#38bdf8">Dell AI Factory</text>
  <text x="340" y="118" text-anchor="middle" font-size="10" fill="#5a7290">企業級 AI 供應商</text>

  <text x="264" y="144" font-size="11" font-weight="600" fill="#8599b0">GPU 伺服器</text>
  <text x="264" y="162" font-size="11" fill="#e2e8f0">PowerEdge XE 系列</text>
  <text x="264" y="178" font-size="11" fill="#e2e8f0">搭載 NVIDIA GPU</text>

  <text x="264" y="204" font-size="11" font-weight="600" fill="#8599b0">儲存</text>
  <text x="264" y="222" font-size="11" fill="#e2e8f0">PowerScale（非結構化）</text>
  <text x="264" y="238" font-size="11" fill="#e2e8f0">ECS（物件儲存）</text>

  <text x="264" y="264" font-size="11" font-weight="600" fill="#8599b0">定位</text>
  <text x="264" y="282" font-size="11" fill="#e2e8f0">與 NVIDIA 深度合作</text>
  <text x="264" y="298" font-size="11" fill="#e2e8f0">硬體到部署一站式服務</text>

  <text x="264" y="324" font-size="11" font-weight="600" fill="#8599b0">優勢</text>
  <text x="264" y="342" font-size="11" fill="#e2e8f0">全球通路和服務</text>

  <!-- ===== HPE ===== -->
  <rect x="451" y="72" width="190" height="280" rx="12" fill="rgba(167,139,250,0.04)" stroke="#a78bfa" stroke-width="0.7"/>
  <text x="546" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#a78bfa">HPE Private AI</text>
  <text x="546" y="118" text-anchor="middle" font-size="10" fill="#5a7290">HPC 背景深厚</text>

  <text x="467" y="144" font-size="11" font-weight="600" fill="#8599b0">GPU 伺服器</text>
  <text x="467" y="162" font-size="11" fill="#e2e8f0">ProLiant DL380a</text>
  <text x="467" y="178" font-size="11" fill="#e2e8f0">Cray XD（超級電腦）</text>

  <text x="467" y="204" font-size="11" font-weight="600" fill="#8599b0">儲存</text>
  <text x="467" y="222" font-size="11" fill="#e2e8f0">Cray ClusterStor</text>
  <text x="467" y="238" font-size="11" fill="#e2e8f0">（平行檔案系統）</text>

  <text x="467" y="264" font-size="11" font-weight="600" fill="#8599b0">歷史</text>
  <text x="467" y="282" font-size="11" fill="#e2e8f0">併購 Cray（超算）</text>
  <text x="467" y="298" font-size="11" fill="#e2e8f0">併購 SGI（圖形）</text>

  <text x="467" y="324" font-size="11" font-weight="600" fill="#8599b0">優勢</text>
  <text x="467" y="342" font-size="11" fill="#e2e8f0">超大規模 AI 訓練</text>

  <!-- Bottom -->
  <text x="340" y="384" text-anchor="middle" font-size="11" fill="#5a7290">三家都需要高速儲存（NVMe SSD）來餵 GPU — 這是儲存控制器技術的價值場景</text>
</svg>
