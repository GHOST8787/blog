<svg viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="350" fill="#0a0e14"/>


  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Switch vs Router：誰管哪一段</text>

  <!-- LAN A -->
  <rect x="36" y="52" width="264" height="200" rx="16" fill="none" stroke="#34d399" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text x="168" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">區域網路 A（LAN A）</text>

  <rect x="108" y="88" width="120" height="40" rx="8" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.6"/>
  <text x="168" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">Switch</text>

  <!-- Devices A -->
  <rect x="52" y="158" width="76" height="32" rx="6" fill="rgba(148,163,184,0.06)" stroke="#64748b" stroke-width="0.5"/>
  <text x="90" y="179" text-anchor="middle" font-size="11" fill="#cbd5e1">Server</text>
  <rect x="142" y="158" width="52" height="32" rx="6" fill="rgba(148,163,184,0.06)" stroke="#64748b" stroke-width="0.5"/>
  <text x="168" y="179" text-anchor="middle" font-size="11" fill="#cbd5e1">PC</text>
  <rect x="208" y="158" width="64" height="32" rx="6" fill="rgba(148,163,184,0.06)" stroke="#64748b" stroke-width="0.5"/>
  <text x="240" y="179" text-anchor="middle" font-size="11" fill="#cbd5e1">NAS</text>

  <line x1="128" y1="128" x2="90" y2="156" stroke="#34d399" stroke-width="0.5"/>
  <line x1="168" y1="128" x2="168" y2="156" stroke="#34d399" stroke-width="0.5"/>
  <line x1="208" y1="128" x2="240" y2="156" stroke="#34d399" stroke-width="0.5"/>

  <text x="168" y="216" text-anchor="middle" font-size="11" fill="#5a7290">Switch 看 MAC 位址</text>
  <text x="168" y="232" text-anchor="middle" font-size="11" fill="#5a7290">管「同一 LAN 內部的通信」</text>

  <!-- Router -->
  <rect x="308" y="118" width="124" height="52" rx="10" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.7"/>
  <text x="370" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">Router</text>
  <text x="370" y="158" text-anchor="middle" font-size="11" fill="#8599b0">路由器</text>

  <!-- Arrows to Router -->
  <line x1="228" y1="108" x2="306" y2="138" stroke="#f59e0b" stroke-width="0.8" marker-end="url(#a)"/>
  <line x1="434" y1="138" x2="502" y2="108" stroke="#f59e0b" stroke-width="0.8" marker-end="url(#a)"/>

  <!-- LAN B -->
  <rect x="440" y="52" width="204" height="200" rx="16" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text x="542" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#38bdf8">區域網路 B（LAN B）</text>

  <rect x="482" y="88" width="120" height="40" rx="8" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="542" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#38bdf8">Switch</text>

  <rect x="474" y="158" width="64" height="32" rx="6" fill="rgba(148,163,184,0.06)" stroke="#64748b" stroke-width="0.5"/>
  <text x="506" y="179" text-anchor="middle" font-size="11" fill="#cbd5e1">Server</text>
  <rect x="552" y="158" width="76" height="32" rx="6" fill="rgba(148,163,184,0.06)" stroke="#64748b" stroke-width="0.5"/>
  <text x="590" y="179" text-anchor="middle" font-size="11" fill="#cbd5e1">Storage</text>

  <line x1="512" y1="128" x2="506" y2="156" stroke="#38bdf8" stroke-width="0.5"/>
  <line x1="572" y1="128" x2="590" y2="156" stroke="#38bdf8" stroke-width="0.5"/>

  <!-- Router description -->
  <text x="370" y="200" text-anchor="middle" font-size="11" fill="#5a7290">Router 看 IP 位址</text>
  <text x="370" y="216" text-anchor="middle" font-size="11" fill="#5a7290">管「不同 LAN 之間的交通」</text>

  <!-- Internet -->
  <line x1="370" y1="170" x2="370" y2="284" stroke="#f59e0b" stroke-width="0.8" marker-end="url(#a)"/>
  <rect x="310" y="290" width="120" height="36" rx="18" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.6"/>
  <text x="370" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#f59e0b">Internet</text>
</svg>
