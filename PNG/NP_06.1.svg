<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" style="font-family:'Noto Sans TC','Inter','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7a8fa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#0a0e14"/>


  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">傳統 IT 基礎架構：四層堆疊</text>

  <!-- Layer 1: Application -->
  <rect x="160" y="60" width="360" height="56" rx="10" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="340" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa">Application（應用程式）</text>
  <text x="340" y="100" text-anchor="middle" font-size="11" fill="#8599b0">ERP、CRM、AI 模型、資料庫</text>

  <!-- Arrow 1 -->
  <line x1="340" y1="116" x2="340" y2="140" stroke="#7a8fa3" stroke-width="1" marker-end="url(#a)"/>
  <text x="356" y="132" font-size="11" fill="#5a7290">跑在</text>

  <!-- Layer 2: Server -->
  <rect x="160" y="144" width="360" height="56" rx="10" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="0.8"/>
  <text x="340" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">Server（伺服器）</text>
  <text x="340" y="184" text-anchor="middle" font-size="11" fill="#8599b0">CPU + RAM + OS，負責運算</text>

  <!-- Arrow 2 -->
  <line x1="340" y1="200" x2="340" y2="224" stroke="#7a8fa3" stroke-width="1" marker-end="url(#a)"/>
  <text x="356" y="216" font-size="11" fill="#5a7290">資料存在</text>

  <!-- Layer 3: Storage -->
  <rect x="160" y="228" width="360" height="56" rx="10" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="340" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#f59e0b">Storage（儲存）</text>
  <text x="340" y="268" text-anchor="middle" font-size="11" fill="#8599b0">HDD / SSD / NVMe，負責保存資料</text>

  <!-- Arrow 3 -->
  <line x1="340" y1="284" x2="340" y2="308" stroke="#7a8fa3" stroke-width="1" marker-end="url(#a)"/>
  <text x="356" y="300" font-size="11" fill="#5a7290">全部透過</text>

  <!-- Layer 4: Network -->
  <rect x="160" y="312" width="360" height="56" rx="10" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="340" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#38bdf8">Network（網路）</text>
  <text x="340" y="352" text-anchor="middle" font-size="11" fill="#8599b0">Switch / Router，負責連接一切</text>

  <!-- Bracket -->
  <path d="M546 154 L556 154 L556 300 L546 300" fill="none" stroke="#5a7290" stroke-width="0.6"/>
  <text x="568" y="220" font-size="11" fill="#5a7290">三層各自獨立</text>
  <text x="568" y="238" font-size="11" fill="#5a7290">各自採購管理</text>

  <text x="340" y="392" text-anchor="middle" font-size="11" fill="#5a7290">問題：管理複雜、擴展要分別擴三樣、資源利用率低 → 後來才有 HCI</text>
</svg>
